services:
  db:
    image: postgres:18
    container_name: lab4_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      # у postgres:18+ дані зберігаються саме в /var/lib/postgresql
      - lab4_pgdata:/var/lib/postgresql

volumes:
  lab4_pgdata:
