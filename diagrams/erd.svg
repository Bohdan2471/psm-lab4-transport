<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1040" viewBox="0 0 1040 1040" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1040" height="1040" fill="#ffffff"/>
  <text x="520" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">ERD — Автотранспортне підприємство (варіант 28)</text>

  <defs>
    <style>
      .tbl   { fill:#ffffff; stroke:#2c3e50; stroke-width:2; }
      .hdr   { fill:#2c3e50; }
      .htxt  { fill:#ffffff; font-size:16px; font-weight:700; }
      .pk    { fill:#1a1a1a; font-size:14px; font-weight:700; }
      .fk    { fill:#b9770e; font-size:14px; font-weight:600; }
      .fld   { fill:#333333; font-size:14px; }
      .rel   { stroke:#2c3e50; stroke-width:2; fill:none; }
      .card  { fill:#c0392b; font-size:15px; font-weight:700; }
      .rlbl  { fill:#555555; font-size:13px; font-style:italic; }
    </style>
  </defs>

  <!-- ===================== VEHICLES ===================== -->
  <g>
    <rect class="tbl" x="40" y="90" width="260" height="196" rx="4"/>
    <rect class="hdr" x="40" y="90" width="260" height="30" rx="4"/>
    <text class="htxt" x="170" y="111" text-anchor="middle">vehicles  (Автомобілі)</text>
    <text class="pk"  x="52" y="140">PK  license_plate</text>
    <text class="fld" x="52" y="162">brand</text>
    <text class="fld" x="52" y="182">tech_condition</text>
    <text class="fld" x="52" y="202">current_location</text>
    <text class="fld" x="52" y="222">avg_speed</text>
    <text class="fld" x="52" y="242">load_capacity</text>
    <text class="fld" x="52" y="262">fuel_consumption</text>
  </g>

  <!-- ===================== DRIVERS ===================== -->
  <g>
    <rect class="tbl" x="740" y="90" width="260" height="196" rx="4"/>
    <rect class="hdr" x="740" y="90" width="260" height="30" rx="4"/>
    <text class="htxt" x="870" y="111" text-anchor="middle">drivers  (Водії)</text>
    <text class="pk"  x="752" y="140">PK  driver_id</text>
    <text class="fld" x="752" y="162">full_name</text>
    <text class="fld" x="752" y="182">birth_date</text>
    <text class="fld" x="752" y="202">experience_years</text>
    <text class="fld" x="752" y="222">salary</text>
    <text class="fld" x="752" y="242">phone</text>
    <text class="fld" x="752" y="262">email</text>
  </g>

  <!-- ===================== TRIPS ===================== -->
  <g>
    <rect class="tbl" x="390" y="470" width="260" height="256" rx="4"/>
    <rect class="hdr" x="390" y="470" width="260" height="30" rx="4"/>
    <text class="htxt" x="520" y="491" text-anchor="middle">trips  (Рейси)</text>
    <text class="pk"  x="402" y="520">PK  trip_id</text>
    <text class="fk"  x="402" y="540">FK  license_plate</text>
    <text class="fk"  x="402" y="560">FK  driver_id</text>
    <text class="fld" x="402" y="580">departure_date</text>
    <text class="fld" x="402" y="600">arrival_date</text>
    <text class="fld" x="402" y="620">destination</text>
    <text class="fld" x="402" y="640">distance</text>
    <text class="fld" x="402" y="660">fuel_used</text>
    <text class="fld" x="402" y="680">fuel_type</text>
    <text class="fld" x="402" y="700">cargo_weight</text>
  </g>

  <!-- ================ DRIVER_VEHICLE_PERMITS ============ -->
  <g>
    <rect class="tbl" x="390" y="150" width="260" height="136" rx="4"/>
    <rect class="hdr" x="390" y="150" width="260" height="30" rx="4"/>
    <text class="htxt" x="520" y="171" text-anchor="middle">driver_vehicle_permits</text>
    <text class="pk"  x="402" y="200">PK  id</text>
    <text class="fk"  x="402" y="220">FK  driver_id</text>
    <text class="fk"  x="402" y="240">FK  license_plate</text>
    <text class="fld" x="402" y="260">category</text>
  </g>

  <!-- ===================== RELATIONSHIPS ===================== -->
  <!-- vehicles -> permits (1:N) -->
  <path class="rel" d="M300 210 H390"/>
  <text class="card" x="312" y="203">1</text>
  <text class="card" x="372" y="203">N</text>

  <!-- drivers -> permits (1:N) -->
  <path class="rel" d="M740 210 H650"/>
  <text class="card" x="722" y="203">1</text>
  <text class="card" x="662" y="203">N</text>

  <!-- vehicles -> trips (1:N) -->
  <path class="rel" d="M170 286 V540 H390"/>
  <text class="card" x="178" y="305">1</text>
  <text class="card" x="372" y="533">N</text>
  <text class="rlbl" x="196" y="430">виконує</text>

  <!-- drivers -> trips (1:N) -->
  <path class="rel" d="M870 286 V560 H650"/>
  <text class="card" x="878" y="305">1</text>
  <text class="card" x="662" y="553">N</text>
  <text class="rlbl" x="790" y="430">керує</text>

  <!-- N:M note between vehicles and drivers through permits -->
  <text class="rlbl" x="520" y="316" text-anchor="middle">зв'язок N : M (водій ↔ автомобіль) реалізовано через таблицю допусків</text>
</svg>
